services:
  nudge:
    build: .
    image: nudge:latest
    container_name: nudge
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Set a fixed admin token instead of the auto-generated one in /data.
      # NUDGE_ADMIN_TOKEN: "change-me-to-a-long-random-string"
      NUDGE_BASE_URL: "http://localhost:8080"
      NUDGE_VAPID_SUBJECT: "mailto:admin@example.com"
