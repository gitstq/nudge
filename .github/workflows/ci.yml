name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: cross-language Web Push KAT
        run: |
          sudo apt-get update -qq && sudo apt-get install -y python3-cryptography
          UPDATE_VECTOR=1 go test ./internal/push/ -run TestDeterministicVector
          python3 tests/kat_webpush.py
      - name: e2e smoke
        run: bash tests/e2e_smoke.sh

  cross-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux amd64
          - linux arm64
          - darwin amd64
          - darwin arm64
          - windows amd64
          - windows arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build ${{ matrix.target }}
        env:
          CGO_ENABLED: 0
        run: |
          set -- ${{ matrix.target }}
          GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w" .

  release:
    needs: [test, cross-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: package all platforms
        run: VERSION=${GITHUB_REF_NAME} bash scripts/build.sh
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/*.tar.gz
            build/*.zip
            build/checksums.txt
